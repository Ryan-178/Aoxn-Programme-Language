name: CI

on:
  push:
    branches: [main]
  pull_request:

# Validation ownership:
# - This workflow: compiler/pipeline/stdlib/TS/UI tests, required C parity/ABI
#   gates and explicit pkg tests on Windows + Linux; Linux also runs X11/Xvfb.
# - release.yml: Windows installer packaging/install/doctor/run smoke checks
#   on version tags or manual dispatch, not on every push.
# - web-bench.yml: Windows web functional parity + reference benchmark, with
#   its own web/** path filters; root Cargo tests do not run that suite.
# - IDE: excluded from the root Cargo workspace and NOT validated here.
#   Separate checks: cargo test --manifest-path ide/src-tauri/Cargo.toml,
#   pnpm --dir ide test, and pnpm --dir ide typecheck (see ide/package.json).
jobs:
  # Windows is the FIRST-CLASS platform: Win32/GDI and WinHTTP tests run here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # the compiler itself no longer links LLVM (v0.29.0: C-emitting
      # backend); the LLVM install provides the clang driver it compiles with
      - name: Install clang (LLVM toolchain)
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --silent
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Build
        run: cargo build

      # A non-virtual workspace defaults to the root package, not every member.
      - name: Test compiler (pipeline, stdlib, TS, UI)
        run: cargo test -p aoxn --locked

      - name: Test C emitter parity and ABI (clang required)
        run: cargo test -p aoxn --locked --test c_emitter_parity --test c_abi
        env:
          AOXN_TEST_REQUIRE_CLANG: "1"

      # The Rust bridge drives rustc (preinstalled on the runner) and links
      # with clang; both are required here so a missing one fails, not skips.
      - name: Test Rust bridge (clang + rustc required)
        run: cargo test -p aoxn --locked --test rust_interop
        env:
          AOXN_TEST_REQUIRE_CLANG: "1"
          AOXN_TEST_REQUIRE_RUSTC: "1"

      # Use Cargo directly: run_pkg_tests.sh is a local Windows SAC workaround,
      # and its unreferenced stamp does not guarantee a new binary hash.
      - name: Test package manager
        run: cargo test -p aoxn-pkg --locked

      - name: Smoke test
        shell: pwsh
        run: |
          cargo run -- run examples\hello.ax
          if ($LASTEXITCODE -ne 0) { throw "hello.ax failed (exit $LASTEXITCODE)" }
          cargo run -- run examples\strings.ax
          if ($LASTEXITCODE -ne 0) { throw "strings.ax failed (exit $LASTEXITCODE)" }
          cargo run -- run examples\stdlib_demo.ax
          if ($LASTEXITCODE -ne 0) { throw "stdlib_demo.ax failed (exit $LASTEXITCODE)" }
          cargo run -- build examples\primes.ax -o primes.exe
          if ($LASTEXITCODE -ne 0) { throw "primes build failed (exit $LASTEXITCODE)" }
          $count = .\primes.exe
          if ($LASTEXITCODE -ne 0) { throw "primes execution failed (exit $LASTEXITCODE)" }
          if ("$count" -ne "9592") { throw "primes returned $count, expected 9592" }

  # Linux: compiler and package-manager tests plus the X11 UI backend,
  # linked against libX11/libXft and driven for 30 real frames under Xvfb.
  # The Windows-only surface (installer, WinHTTP) is not covered here.
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-cargo-

      # clang compiles the generated C; the X headers are needed to LINK a
      # ui_x11 program (X11 + Xft + their fontconfig/freetype deps)
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libcurl4-openssl-dev libx11-dev libxft-dev libfontconfig1-dev xvfb

      - name: Build
        run: cargo build

      - name: Linux installer contract tests
        run: python3 -B tools/test_install_linux.py

      - name: Linux HTTPS certificate rejection
        run: python3 -B tools/test_linux_https.py

      - name: Linux HTTP, SDK and socket native regressions
        run: cargo test -p aoxn --locked --test net --test linux_sdks --test socket --test linux_abi
        env:
          AOXN_TEST_REQUIRE_CLANG: "1"
          AOXN_TEST_REQUIRE_RUSTC: "1"

      # A non-virtual workspace defaults to the root package, not every member.
      - name: Test compiler (pipeline, stdlib, TS, UI)
        run: cargo test -p aoxn --locked

      - name: Test C emitter parity and ABI (clang required)
        run: cargo test -p aoxn --locked --test c_emitter_parity --test c_abi
        env:
          AOXN_TEST_REQUIRE_CLANG: "1"

      # The Rust bridge drives rustc (preinstalled on the runner) and links
      # with clang; both are required here so a missing one fails, not skips.
      - name: Test Rust bridge (clang + rustc required)
        run: cargo test -p aoxn --locked --test rust_interop
        env:
          AOXN_TEST_REQUIRE_CLANG: "1"
          AOXN_TEST_REQUIRE_RUSTC: "1"

      # Use Cargo directly: run_pkg_tests.sh is a local Windows SAC workaround,
      # and its unreferenced stamp does not guarantee a new binary hash.
      - name: Test package manager
        run: cargo test -p aoxn-pkg --locked

      - name: Smoke test
        run: |
          cargo run -- run examples/hello.ax
          cargo run -- run examples/strings.ax
          cargo run -- run examples/stdlib_demo.ax
          cargo run -- build examples/primes.ax -o primes
          count=$(./primes)
          if [ "$count" != "9592" ]; then echo "primes returned $count, expected 9592"; exit 1; fi

      - name: Linux installer and installed-toolchain smoke
        run: |
          PREFIX="$RUNNER_TEMP/aoxn install"
          bash dist/package-linux.sh --output "$RUNNER_TEMP/linux-package"
          PACKAGE="$(find "$RUNNER_TEMP/linux-package" -name '*.tar.gz' -type f)"
          (cd "$RUNNER_TEMP/linux-package" && sha256sum -c *.sha256)
          mkdir -p "$RUNNER_TEMP/linux-unpacked"
          tar -xzf "$PACKAGE" -C "$RUNNER_TEMP/linux-unpacked"
          bash "$RUNNER_TEMP/linux-unpacked/$(basename "$PACKAGE" .tar.gz)/dist/install-linux.sh" --prefix "$PREFIX" --no-modify-path
          unset AOXN_HOME AOXN_STDLIB
          export AOXN_CACHE_DIR="$RUNNER_TEMP/aoxn-installed-cache"
          python3 tools/linux_installed_smoke.py "$PREFIX"
          cd "$RUNNER_TEMP"
          "$PREFIX/bin/aoxn" doctor
          "$PREFIX/bin/aoxn" run "$PREFIX/examples/hello.ax"
          "$PREFIX/bin/aoxn" run "$PREFIX/examples/stdlib_demo.ax"
          "$PREFIX/bin/aoxn" run "$PREFIX/examples/threading_demo.ax"
          "$PREFIX/bin/aoxn" build "$PREFIX/examples/ui_probe_x11.ax" -o "$RUNNER_TEMP/installed-ui" -l X11 -l Xft
          xvfb-run -a "$RUNNER_TEMP/installed-ui"

      - name: X11 backend probe (Xvfb)
        run: |
          cargo run -- build examples/ui_probe_x11.ax -o ui-probe -l X11 -l Xft
          xvfb-run -a ./ui-probe

  # macOS: NATIVE runtime evidence for the macOS port (Apple Silicon runner).
  # The compiler emits C and links with Apple clang (Command Line Tools,
  # preinstalled); rustc is preinstalled too. Unlike a cross-check, this job
  # COMPILES AND RUNS the Cocoa UI backend and the libcurl HTTP bridge on real
  # macOS, so the platform guards (`target_os() == "macos"`) are exercised at
  # runtime, not just folded away. The macOS installer (dist/install-macos.sh)
  # is built and run here too; the Windows-only surface (WinHTTP, Win32/GDI,
  # the PE installer) is not covered here.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Apple clang ships with the Command Line Tools. Pin AOXN_CLANG to it so
      # discovery never falls through to a Windows-only candidate path. Export
      # SDKROOT too: the self-hosted compiler and the Rust bridge spawn clang
      # by bare path and inherit this, so ld resolves libSystem against the SDK
      # (without it the link fails with "library 'System' not found").
      - name: Select Apple clang
        run: |
          echo "AOXN_CLANG=$(xcrun --find clang)" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          clang --version

      - name: Build
        run: cargo build

      # A non-virtual workspace defaults to the root package, not every member.
      - name: Test compiler (pipeline, stdlib, TS, UI)
        run: cargo test -p aoxn --locked

      - name: Test C emitter parity and ABI (clang required)
        run: cargo test -p aoxn --locked --test c_emitter_parity --test c_abi
        env:
          AOXN_TEST_REQUIRE_CLANG: "1"

      # The Rust bridge drives rustc and links with clang; both are required
      # here so a missing one fails, not skips. Includes the extern-declaration
      # dedup that lets net/http.ax declare the bridge externs while
      # net/http_macos.ax links the .rs that defines them.
      - name: Test Rust bridge (clang + rustc required)
        run: cargo test -p aoxn --locked --test rust_interop
        env:
          AOXN_TEST_REQUIRE_CLANG: "1"
          AOXN_TEST_REQUIRE_RUSTC: "1"

      - name: Test package manager
        run: cargo test -p aoxn-pkg --locked

      - name: Smoke test
        run: |
          cargo run -- run examples/hello.ax
          cargo run -- run examples/strings.ax
          cargo run -- run examples/stdlib_demo.ax
          cargo run -- build examples/primes.ax -o primes
          count=$(./primes)
          if [ "$count" != "9592" ]; then echo "primes returned $count, expected 9592"; exit 1; fi

      # Native Cocoa backend: the build links AppKit/Foundation/CoreGraphics/
      # objc through the Rust bridge's native-static-libs note; the run drives
      # 30 real frames in an NSWindow and prints "ui-cocoa-ok".
      - name: Cocoa backend probe (native window)
        run: |
          cargo run -- build examples/ui_probe_cocoa.ax -o ui-probe-cocoa
          ./ui-probe-cocoa

      # Native libcurl HTTP bridge: the build links -lcurl through the bridge;
      # the run exercises net/http.ax's macOS dispatch against a loopback
      # server (no external network, no TLS certificate needed).
      - name: macOS HTTP transport probe (libcurl)
        run: |
          python3 -m http.server 8765 --directory examples &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          cargo run -- build examples/http_macos_probe.ax -o http-macos-probe
          ./http-macos-probe http://127.0.0.1:8765/hello.ax

      # Native installer: build from source, lay out bin/ + lib/stdlib +
      # examples under a prefix, then prove the INSTALLED toolchain runs —
      # doctor plus a stdlib import resolved through AOXN_HOME/lib/stdlib (the
      # installed tree, not the checkout). Downloads nothing.
      - name: macOS installer and installed-toolchain smoke
        run: |
          PREFIX="$RUNNER_TEMP/aoxn-install"
          bash dist/install-macos.sh --prefix "$PREFIX"
          export AOXN_HOME="$PREFIX"
          "$PREFIX/bin/aoxn" doctor
          "$PREFIX/bin/aoxn" run "$PREFIX/examples/hello.ax"
          "$PREFIX/bin/aoxn" run "$PREFIX/examples/stdlib_demo.ax"
